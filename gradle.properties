org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true

# Deliberately left off. `verify` runs spotlessApply alongside the compile and test
# tasks, and cross-project parallelism is the only way one of them could read a file
# while Spotless is rewriting it.
org.gradle.parallel=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
