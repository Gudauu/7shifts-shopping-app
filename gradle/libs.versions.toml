# These versions are a single compatibility envelope, not independent choices. Android
# Lint reports NewerVersionAvailable and GradleDependency warnings against several of
# them; those warnings are expected and must not be "fixed" in passing. Raising any one
# pin below forces most of the others up with it, so an upgrade is its own issue.
#
# The ceiling is compileSdk 36 with AGP 8.x. Moving past it means compileSdk 37 and
# AGP 9.1, which is a major-version migration.

[versions]
# AGP 9.1 is required by the next androidx releases; staying on 8.x keeps compileSdk 36.
agp = "8.13.2"
# KSP is versioned against an exact Kotlin release, so these two move together or not at
# all. No KSP build exists for Kotlin 2.4 yet, which caps Kotlin here.
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
# Hilt 2.58 and later require AGP 9.0.
hilt = "2.57.2"
# hilt-navigation-compose 1.4.0 requires compileSdk 37 and AGP 9.1.
hiltNavigationCompose = "1.3.0"
spotless = "8.9.0"
# Must equal the ktlint that composeRules below was built against. A mismatch does not
# degrade gracefully: every file fails with the standard:annotation-spacing rule throwing.
ktlint = "1.8.0"
composeRules = "0.6.3"

# androidx core 1.18+ and lifecycle 2.10+ require compileSdk 37 and AGP 9.1.
coreKtx = "1.17.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
lifecycle = "2.9.4"
navigationCompose = "2.9.8"

retrofit = "2.12.0"
kotlinxSerialization = "1.9.0"
# Coil 3.4.0 and later ship Kotlin 2.4 metadata, which the Kotlin 2.2 compiler cannot
# read. The failure is an unhelpful "incompatible version of Kotlin" on kotlin.Unit.
coil = "3.3.0"

junit = "4.13.2"
androidxTestJunit = "1.3.0"
coroutinesTest = "1.10.2"
turbine = "1.2.1"
robolectric = "4.16.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# Referenced as a Spotless custom rule set, not as a project dependency.
compose-rules-ktlint = { group = "io.nlopez.compose.rules", name = "ktlint", version.ref = "composeRules" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
